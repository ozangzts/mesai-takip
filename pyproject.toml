[project]
name = "mesai-takip"
version = "0.1.0"
description = "DEICO monthly working-time report generator"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",     # .xlsx / .xlsm
    "xlrd>=2.0",         # .xls only — the Macunköy export switched to it in July 2026
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
mesai = "mesai.cli:main"

# The window. `gui-scripts` rather than `scripts` so Windows launches it without a
# console flashing up behind it.
[project.gui-scripts]
mesai-arayuz = "mesai.gui:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
