# Working-time parameters. See docs/DOMAIN-RULES.md.
# Every threshold in the system lives here. Changing a rule must be a YAML edit,
# never a code edit.

normal_shift:
  start: "07:30"
  end: "16:30"

# How one person-day is turned into hours. See ADR-015.
#   envelope = earliest entry -> latest exit; gaps inside the day are paid
#   union    = sum of the merged intervals; gaps inside the day are unpaid
# Cross-site overlap is de-duplicated either way — that is ADR-001 and not
# configurable.
daily_hours: envelope

break:
  # deduct: false pays through the break — the badged day is the payroll figure.
  # See ADR-016. The residual-break arithmetic below stays implemented and tested;
  # flipping this to true re-enables it without a code change.
  deduct: false
  # Unpaid break per day, and the window in which a gap counts as that break.
  minutes: 45
  window_from: "11:00"
  window_to: "14:30"
  # Days shorter than this get no break deduction at all.
  min_workday_hours: 6.0

plausibility:
  # There is no per-interval minimum any more. A 13:32 -> 13:34 badge test used to
  # raise "Aralık çok kısa", which put 11 people on the May list and 20 on June's —
  # and every one of those whose only note it was had a perfectly ordinary month
  # (106-242 hours over 11-24 days). It was reporting a stray reading, not a person.
  # The day-level check below is what actually answers "did this person work". ADR-031.
  # A whole PERSON-DAY shorter than this is kept but flagged. Different question from
  # min_minutes: that one catches a bad record, this one catches a real person who
  # barely worked. HR asked for 2 hours (ADR-019).
  short_day_hours: 2.0
  # A person-DAY longer than this is flagged — counted, never excluded. A 16-hour day
  # is real work until somebody says otherwise (ADR-032).
  # Also the ceiling for
  # accepting a midnight-crossing repair.
  max_shift_hours: 16.0

  # A SEPARATE ceiling, for intervals the program repaired rather than read. When the
  # exit precedes the entry we assume the shift crossed midnight and add 24 hours; if
  # that assumption lands above this, the assumption was wrong and the record is
  # refused. Measured on May and June 2026: the three broken records land at 21:56,
  # 23:58 and 23:59, while the longest genuine midnight crossing is 15:36.
  #
  # 20 rather than 16, because 16 was only 24 minutes above that longest real crossing
  # and a sixteen-hour night shift is not impossible. It is deliberately NOT the same
  # number as max_shift_hours: one flags a long day, this one rejects a bad guess, and
  # tying them together once already cost two people a day they had worked. ADR-033.
  repair_max_hours: 20

# What a declared remote-work day does to that day's attendance records (ADR-018).
#   nominal_only — remote hours replace the attendance record only when every
#                  attendance record for that day is the nominal_day placeholder.
#                  Real turnstile readings are kept and unioned as before.
#   always       — remote hours always replace the day's attendance records
#   never        — pre-ADR-018 behaviour: everything is unioned
remote_day_replaces_attendance: nominal_only

# Input file discovery. The CLI globs these patterns in the input directory, so
# a Drive-synced folder can be pointed at directly. First match wins.
#
# `*.xls*` deliberately covers .xlsx, .xlsm AND .xls: the Macunköy export switched
# from .xlsx to .xls in July 2026 with no warning (DATA-SOURCES.md D10), and a pattern
# that only matched one container turned a format change into "file not found".
# base.open_sheets decides how to read whatever matched, and rejects .xlsb by name.
sources:
  # Employee roster. Globs are case-insensitive on Windows, but Turkish characters
  # are not folded — so "çalışan" needs its own entry alongside "calisan".
  # If none of these match, a single spreadsheet alone in the roster folder is
  # accepted; the reader then validates the layout, so a wrong file fails loudly.
  roster:
    - "*calisan*.xls*"
    - "*çalışan*.xls*"
    - "*personel*.xls*"
    - "SYST03*.xls*"
  izin:
    - "*IZIN*.xls*"
    - "*İZİN*.xls*"
  macunkoy:
    - "*Macunköy*.xls*"
    - "*Macunkoy*.xls*"
  teknopark:
    - "*Teknopark*.xls*"

# Leave types from the HCM export that are actually worked time, not absence.
#
# CLOSED LIST — exactly one entry, confirmed by HR (ADR-007, ADR-037). Everything
# else the HCM writes is absence, `Eğitim İzni` included.
#
# Do not add a type because its rows carry clock times: EVERY leave type's rows do,
# annual leave included. The time is when the leave began, not evidence anybody was
# present. That reasoning kept training open as a question for seventeen days and was
# wrong. A second entry needs a new ADR, and a test asserts this list.
worked_leave_types:
  - "Uzaktan Çalışma"

# The Teknopark timesheet writes a NOMINAL day when an expected workday has no
# turnstile data: exactly these times, duration exactly 09:00, never at a weekend.
# 319 of 1 607 May rows and 418 of 2 557 June rows. It is not a badge reading, but it
# IS counted as worked time — that is ADR-017. Recorded here only so the report can
# tell the reader which side of a remote-work overlap was nominal.
# If the vendor's default changes, change it here; nothing else needs to know.
nominal_day:
  source: teknopark
  entry: "09:00"
  exit: "18:00"

# ---------------------------------------------------------------------------
# What the roster's "Tesis" column is called in the report.
#
# The roster says MACUNKÖY TESİSİ and DEICO TESİS. The second one names the company,
# not the place, and nobody outside the HCM calls it that — the site is Teknopark, and
# the report already labels attendance records from it "Teknopark". Two words for one
# building in one workbook is a question the reader should not have to answer.
#
# Matched on a folded (ASCII, upper-case) SUBSTRING, so "MACUNKÖY TESİSİ" and
# "MACUNKOY TESIS" both hit the same entry and a suffix change does not break it.
# A value matching nothing is shown exactly as the roster wrote it — never guessed —
# and listed on the Kontrol sheet so a new facility is noticed rather than absorbed.
# ADR-026.
facility_labels:
  MACUNKOY: "Macunköy"
  DEICO: "Teknopark"

