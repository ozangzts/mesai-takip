# Working-time parameters. See docs/DOMAIN-RULES.md.
# Every threshold in the system lives here. Changing a rule must be a YAML edit,
# never a code edit.

normal_shift:
  start: "07:30"
  end: "16:30"

# How one person-day is turned into hours. See ADR-015.
#   envelope = earliest entry -> latest exit; gaps inside the day are paid
#   union    = sum of the merged intervals; gaps inside the day are unpaid
# Cross-site overlap is de-duplicated either way — that is ADR-001 and not
# configurable.
daily_hours: envelope

break:
  # deduct: false pays through the break — the badged day is the payroll figure.
  # See ADR-016. The residual-break arithmetic below stays implemented and tested;
  # flipping this to true re-enables it without a code change.
  deduct: false
  # Unpaid break per day, and the window in which a gap counts as that break.
  minutes: 45
  window_from: "11:00"
  window_to: "14:30"
  # Days shorter than this get no break deduction at all.
  min_workday_hours: 6.0

plausibility:
  # A single interval shorter than this is kept but flagged — badge-test artefacts
  # like 13:32 -> 13:34.
  min_minutes: 5
  # A whole PERSON-DAY shorter than this is kept but flagged. Different question from
  # min_minutes: that one catches a bad record, this one catches a real person who
  # barely worked. HR asked for 2 hours (ADR-019).
  short_day_hours: 2.0
  # An interval longer than this is excluded and flagged. Also the ceiling for
  # accepting a midnight-crossing repair.
  max_shift_hours: 16.0

# What a declared remote-work day does to that day's attendance records (ADR-018).
#   nominal_only — remote hours replace the attendance record only when every
#                  attendance record for that day is the nominal_day placeholder.
#                  Real turnstile readings are kept and unioned as before.
#   always       — remote hours always replace the day's attendance records
#   never        — pre-ADR-018 behaviour: everything is unioned
remote_day_replaces_attendance: nominal_only

# Input file discovery. The CLI globs these patterns in the input directory, so
# a Drive-synced folder can be pointed at directly. First match wins.
sources:
  # Employee roster. Globs are case-insensitive on Windows, but Turkish characters
  # are not folded — so "çalışan" needs its own entry alongside "calisan".
  # If none of these match, a single .xlsx alone in the roster folder is accepted;
  # the reader then validates the layout, so a wrong file fails loudly.
  roster:
    - "*calisan*.xlsx"
    - "*çalışan*.xlsx"
    - "*personel*.xlsx"
    - "SYST03*.xlsx"
  izin:
    - "*IZIN*.xlsx"
    - "*İZİN*.xlsx"
  macunkoy:
    - "*Macunköy*.xlsx"
    - "*Macunkoy*.xlsx"
  teknopark:
    - "*Teknopark*.xlsx"

# Leave types from the HCM export that are actually worked time, not absence.
# See ADR-007.
worked_leave_types:
  - "Uzaktan Çalışma"

# The Teknopark timesheet writes a NOMINAL day when an expected workday has no
# turnstile data: exactly these times, duration exactly 09:00, never at a weekend.
# 319 of 1 607 May rows and 418 of 2 557 June rows. It is not a badge reading, but it
# IS counted as worked time — that is ADR-017. Recorded here only so the report can
# tell the reader which side of a remote-work overlap was nominal.
# If the vendor's default changes, change it here; nothing else needs to know.
nominal_day:
  source: teknopark
  entry: "09:00"
  exit: "18:00"

# ---------------------------------------------------------------------------
# Phase 2 parameters. Defined but NOT yet used by any code — the rules they
# drive are blocked on Q5-Q8 in docs/ROADMAP.md. Do not wire these up until
# HR has confirmed them.
# ---------------------------------------------------------------------------
overtime:
  expected_daily_net_hours: 8.25   # UNCONFIRMED - Q5
  week_starts: "monday"            # UNCONFIRMED - Q6
  multinet:
    - {from_hours: 3.0, to_hours: 7.5, count: 1}
    - {from_hours: 7.5, to_hours: null, count: 2}

shifts:  # UNCONFIRMED - Q7
  - {name: "Normal Mesai", entry_from: "05:00", entry_to: "11:59", start: "07:30", end: "16:30"}
  - {name: "1. Vardiya",   entry_from: "12:00", entry_to: "20:59", start: "16:00", end: "01:00"}
  - {name: "2. Vardiya",   entry_from: "21:00", entry_to: "04:59", start: "00:00", end: "08:00"}
