# Kişiye gönderilen e-postanın metni.
#
# BU DOSYA PROGRAMIN İÇİNDE DEĞİL, YANINDA. Metni değiştirmek için programı yeniden
# derlemek gerekmez — burayı düzenleyip kaydetmek yeter. Sebebi settings.yaml ile aynı:
# değişecek olan şey koda gömülmez.
#
# Süslü parantezli yerler program tarafından doldurulur. Tanımadığı bir isim yazarsanız
# program durup söyler; sessizce "{ad}" yazan bir mail göndermez.
#
#   {ad}      kişinin adı soyadı
#   {donem}   "Temmuz 2026"
#   {yil}     "2026" — raporun dönemi, bugünün yılı değil
#   {gunler}  aşağıdaki `gun_satiri` her seçili gün için doldurulup buraya konur
#
# `gun_satiri` ve `html_gun_satiri` içinde kullanılabilecekler:
#
#   {tarih}   14.07.2026
#   {gun}     Sal
#   {sorun}   o gün için işaretlenmiş notun adı, örn. "Çıkış yok"
#   {okuma}   o gün ne okunduğu, örn. "giriş 07:41, çıkış kaydı yok"
#   {giris}   07:41   (okunmamışsa "—")
#   {cikis}   18:26   (okunmamışsa "—")
#   {sure}    9:05    (o gün için süre sayılmamışsa "—")

konu: "{donem} mesai kayıtları"

# --- Düz metin --------------------------------------------------------------
#
# HTML gösteremeyen bir mail programı bunu gösterir. Aşağıdaki HTML ile AYNI bilgiyi
# taşımalı: okuyan hangi biçimi gördüğüne bağlı olarak farklı bir şey anlamamalı.

govde: |
  Sayın {ad},

  {donem} dönemi giriş-çıkış kayıtları incelenmiştir. Aşağıdaki günlerde
  kayıtlarınızda eksik ya da tutarsız bir durum tespit edilmiştir:

  {gunler}

  Yukarıdaki günlere ilişkin açıklamanızı bu e-postayı yanıtlayarak iletmenizi
  rica ederiz.

  İyi çalışmalar.
  DEICO Mühendislik

gun_satiri: "  · {tarih} {gun} — {sorun} ({okuma})"

# Tarihli hiçbir günü olmayan kişiye giden metin — ayın tamamında kart kaydı yoksa
# listelenecek bir gün yoktur ve boş bir madde listesi göndermek anlamsız olur.
gunsuz_govde: |
  Sayın {ad},

  {donem} dönemi giriş-çıkış kayıtları incelenmiştir. Söz konusu dönem için
  tarafınıza ait giriş-çıkış kaydına ulaşılamamıştır.

  Durumu bu e-postayı yanıtlayarak bildirmenizi rica ederiz.

  İyi çalışmalar.
  DEICO Mühendislik

# --- HTML -------------------------------------------------------------------
#
# Boş bırakılırsa yalnızca yukarıdaki düz metin gönderilir.
#
# Biçim DEICO'nun mevcut bilgilendirme maillerinden alındı. İki şey bilerek değişti:
#
#   1. Özgün şablonda yılı `<script>` yazıyordu. Hiçbir mail programı script
#      çalıştırmaz — her yerde silinir. Yıl artık {yil} ile dolduruluyor.
#   2. Renkler ve dolgular hem <style> içinde hem ilgili etiketin `style="..."`
#      özelliğinde var. Outlook masaüstü Word motoruyla çizdiği için <style>
#      bloğunun çoğunu yok sayıyor; satır içi yazılmayan renk orada kaybolur.
#      Yuvarlatılmış köşeler ve max-width Outlook'ta yine görünmez, bu kabul edildi.
#
# Son kolon (`Açıklama`) bilerek boş: kişi cevabını gün gün oraya yazıyor.
#
# Bu, alıcıların Outlook masaüstü kullandığı bilindiği için böyle. "Yanıtla"ya basınca
# Outlook tabloyu yanıtın içine alıyor ve boş hücreye tıklayıp yazmaya izin veriyor.
# İki teknik ayrıntı bunun çalışması için gerekli ve ikisi de aşağıda var:
#
#   - Boş hücrede `&nbsp;` var. Tamamen boş bir <td> Outlook'ta çökebiliyor: kenar
#     çizgisi kayboluyor ve tıklanacak bir alan kalmıyor.
#   - `Açıklama` kolonuna genişlik verildi. Yazılacak yerin görünür olması lazım,
#     yoksa hücre içeriğine göre daralıyor ve yazacak yer yok gibi duruyor.
#
# Telefon uygulamaları tabloyu çoğu zaman düzleştiriyor; o durumda kişi normal metinle
# yanıtlar. Düz metin sürümü (yukarıda) bu yüzden "günü belirterek yanıtlayın" diyor —
# tablosu olmayan bir biçimde "tabloyu doldur" demek anlamsız olurdu.

html_govde: |
  <!DOCTYPE html>
  <html lang="tr">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
  body { font-family: Calibri, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0; }
  .email-container { max-width: 640px; margin: 40px auto; background-color: #ffffff; padding: 20px; border-radius: 8px; }
  .header, .footer { background-color: #004c7a; color: #ffffff; text-align: center; }
  .header { padding: 18px 0; border-top-left-radius: 8px; border-top-right-radius: 8px; }
  .footer { padding: 10px 0; font-size: 13px; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; }
  .info, .notes-section { padding: 16px 20px; background-color: #e8f1fb; margin: 18px 0; border-left: 5px solid #ff6f00; }
  .bold-previous { font-weight: bold; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 18px; font-size: 12px; }
  th { padding: 7px 10px; text-align: left; background-color: #e8f1fb; color: #555555; font-weight: bold; }
  td { padding: 7px 10px; border-bottom: 1px solid #e0e0e0; }
  </style>
  </head>
  <body style="font-family:Calibri,sans-serif;background-color:#f4f4f4;margin:0;padding:0">
  <div class="email-container" style="max-width:640px;margin:40px auto;background-color:#ffffff;padding:20px">
    <div class="header" style="background-color:#004c7a;color:#ffffff;text-align:center;padding:18px 0">
      <h2 style="margin:0;font-size:19px">{donem} Mesai Kayıtları</h2>
    </div>
    <div class="info" style="padding:16px 20px;background-color:#e8f1fb;border-left:5px solid #ff6f00;margin:18px 0">
      <span class="bold-previous" style="font-weight:bold">Sayın {ad}</span>,<br>
      {donem} dönemi giriş-çıkış kayıtlarınız incelenmiştir. Aşağıdaki günlerde
      kayıtlarınızda eksik ya da tutarsız bir durum tespit edilmiştir.
    </div>
    <table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:18px">
      <thead>
        <tr>
          <th style="padding:7px 10px;text-align:left;background-color:#e8f1fb;color:#555555">Tarih</th>
          <th style="padding:7px 10px;text-align:left;background-color:#e8f1fb;color:#555555">Giriş</th>
          <th style="padding:7px 10px;text-align:left;background-color:#e8f1fb;color:#555555">Çıkış</th>
          <th style="padding:7px 10px;text-align:left;background-color:#e8f1fb;color:#555555">Sebep</th>
          <th width="35%" style="width:35%;padding:7px 10px;text-align:left;background-color:#e8f1fb;color:#555555">Açıklama</th>
        </tr>
      </thead>
      <tbody>
  {gunler_html}
      </tbody>
    </table>
    <div class="notes-section" style="padding:16px 20px;background-color:#e8f1fb;border-left:5px solid #ff6f00;margin:18px 0">
      <span style="font-weight:bold">Yanıtla</span>'ya basıp yukarıdaki tablonun
      <span style="font-weight:bold">Açıklama</span> kolonuna ilgili günün satırında
      açıklamanızı yazmanız ve yanıtı göndermeniz yeterlidir.
    </div>
    <div class="footer" style="background-color:#004c7a;color:#ffffff;text-align:center;padding:10px 0;font-size:13px">
      © {yil} DEICO Mühendislik
    </div>
  </div>
  </body>
  </html>

html_gun_satiri: |
      <tr><td style="padding:7px 10px;border-bottom:1px solid #e0e0e0">{tarih}</td><td style="padding:7px 10px;border-bottom:1px solid #e0e0e0">{giris}</td><td style="padding:7px 10px;border-bottom:1px solid #e0e0e0">{cikis}</td><td style="padding:7px 10px;border-bottom:1px solid #e0e0e0">{sorun}</td><td width="35%" style="width:35%;padding:7px 10px;border-bottom:1px solid #e0e0e0">&nbsp;</td></tr>

html_gunsuz_govde: |
  <!DOCTYPE html>
  <html lang="tr">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
  <body style="font-family:Calibri,sans-serif;background-color:#f4f4f4;margin:0;padding:0">
  <div style="max-width:640px;margin:40px auto;background-color:#ffffff;padding:20px">
    <div style="background-color:#004c7a;color:#ffffff;text-align:center;padding:18px 0">
      <h2 style="margin:0;font-size:19px">{donem} Mesai Kayıtları</h2>
    </div>
    <div style="padding:16px 20px;background-color:#e8f1fb;border-left:5px solid #ff6f00;margin:18px 0">
      <span style="font-weight:bold">Sayın {ad}</span>,<br>
      {donem} dönemi giriş-çıkış kayıtları incelenmiştir. Söz konusu dönem için
      tarafınıza ait giriş-çıkış kaydına ulaşılamamıştır.
    </div>
    <div style="padding:16px 20px;background-color:#e8f1fb;border-left:5px solid #ff6f00;margin:18px 0">
      Durumu bu e-postayı yanıtlayarak bildirmenizi rica ederiz.
    </div>
    <div style="background-color:#004c7a;color:#ffffff;text-align:center;padding:10px 0;font-size:13px">
      © {yil} DEICO Mühendislik
    </div>
  </div>
  </body>
  </html>
