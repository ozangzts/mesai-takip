# Public holidays and weekly rest days.
#
# STATUS: not supplied by HR. The 2026-05 entries were INFERRED from the data; the
# 2026-07 one is a fixed-date statutory holiday, confirmed against the data as well.
# See docs/DATA-SOURCES.md §6.2 and open question Q16 in docs/ROADMAP.md.
#
# WHAT DEPENDS ON THIS FILE — the comment here used to say "only the Gün column
# label", and that stopped being true:
#
#   1. the "Gün" column label in the daily detail sheet;
#   2. `Calendar.expected_workdays`, which is the coverage guard's denominator
#      (ADR-020) and the denominator of the `Ay büyük ölçüde boş` note (ADR-030);
#   3. splitting a MULTI-DAY `Uzaktan Çalışma` row into per-day worked intervals,
#      which skips holidays — so a missing holiday here can add paid hours.
#
# A missing holiday therefore inflates the expected working days and can flag people
# who were not actually absent. Measured on July 2026: adding 15 July removed two
# such notes and changed nobody's hours.
#
# A holiday NEVER removes hours from somebody who worked. Weekend and holiday work
# is counted in full (docs/KURALLAR.md §4) — seven people badged in on 15 July 2026
# and kept every minute.

weekly_rest_days: [saturday, sunday]

# The fixed-date statutory holidays are listed for the WHOLE year, not just for the
# months reported on so far. They are law and the same every year, so leaving them out
# until a month needs them is how 15 July came to be missing from a July report. The
# ones that move — Ramazan and Kurban Bayramı — cannot be listed this way and have to
# be entered before running a month that contains one. A month with no entry at all is
# called out on the report's Kontrol sheet.
holidays:
  2026-01-01: "Yılbaşı"
  2026-04-23: "Ulusal Egemenlik ve Çocuk Bayramı"
  2026-05-01: "Emek ve Dayanışma Günü"
  2026-05-19: "Atatürk'ü Anma, Gençlik ve Spor Bayramı"
  2026-05-25: "Toplu İzin (köprü)"          # INFERRED
  2026-05-26: "Kurban Bayramı Arefesi"      # INFERRED - half day
  2026-05-27: "Kurban Bayramı 1. Gün"       # INFERRED
  2026-05-28: "Kurban Bayramı 2. Gün"       # INFERRED
  2026-05-29: "Kurban Bayramı 3. Gün"       # INFERRED
  # Fixed-date statutory holiday, so not an inference — and the data agrees twice
  # over: 7 people badged in that Wednesday against a weekday median of 130 (5 %).
  2026-07-15: "Demokrasi ve Millî Birlik Günü"
  2026-08-30: "Zafer Bayramı"
  2026-10-29: "Cumhuriyet Bayramı"

half_days:
  - 2026-05-26
