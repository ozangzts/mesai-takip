# Tatil günleri ve hafta tatili.
#
# Tatil günleri programı kullanan kişi tarafından işaretlenir — pencerede Takvim
# ekranı. Program hiçbir günü kendisi tatil yapmaz.
#
# BU DOSYAYA NELER DAYANIYOR — buradaki yorum bir kez "sadece Gün kolonu etiketi,
# hiçbir saat hesabı buna dayanmıyor" diyordu ve yanlıştı. Bugünkü hâli:
#
#   1. Günlük Detay sayfasındaki "Gün" kolonu etiketi (`Tatil`);
#   2. `Calendar.expected_workdays` — kaynak dosya ayın tamamını kapsıyor mu
#      kontrolünün ve `Ay büyük ölçüde boş` notunun paydası;
#   3. Birden fazla günü kapsayan bir uzaktan çalışma beyanı güne bölünürken
#      tatiller atlanır — yani buradan eksik bir gün ödenen saate dönüşebilir.
#
# Eksik bir tatil, beklenen iş günü sayısını şişirir ve aslında devamsız olmayan
# kişileri işaretleyebilir. Buna karşılık bir tatil, ÇALIŞAN kimsenin saatini
# eksiltmez: hafta sonu ve tatil çalışması tam sayılır (docs/KURALLAR.md §4).
#
# Yeni bir yıl için: `takvim-2027.yaml` açın, aynı iki anahtar yeter.

weekly_rest_days: [saturday, sunday]

